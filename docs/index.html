<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>iPant Future — Astrology Engine</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body{font-family:Inter,Arial,sans-serif;background:#0b1220;color:#fff;margin:0}
    .wrap{max-width:900px;margin:40px auto;padding:24px}
    .card{background:#131c2f;border:1px solid #2b3859;border-radius:16px;padding:20px}
    input,button,textarea{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #33446e;background:#0f172a;color:#fff}
    button{background:#7c3aed;border:none;font-weight:700;cursor:pointer}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    pre{white-space:pre-wrap;background:#0a1020;padding:16px;border-radius:12px;overflow:auto}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>iPant Future</h1>
      <p>Full Vedic astrology engine with summarized AI interpretation.</p>
      <div class="grid">
        <input id="dob" type="date" />
        <input id="tob" type="time" />
      </div>
      <p></p>
      <input id="place" placeholder="Birth place, e.g. Pune, India" />
      <p></p>
      <textarea id="question" rows="3" placeholder="Optional question"></textarea>
      <p></p>
      <button id="run">Generate</button>
      <h3>Summary</h3>
      <pre id="summary"></pre>
      <h3>Chart JSON</h3>
      <pre id="chart"></pre>
    </div>
  </div>
<script>
const API = "http://localhost:8000";
document.getElementById("run").addEventListener("click", async () => {
  const payload = {
    date_of_birth: document.getElementById("dob").value,
    time_of_birth: document.getElementById("tob").value,
    birth_place: document.getElementById("place").value,
    question: document.getElementById("question").value || null
  };
  const res = await fetch(API + "/api/reading", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify(payload)
  });
  const data = await res.json();
  document.getElementById("summary").textContent = data.summary || JSON.stringify(data, null, 2);
  document.getElementById("chart").textContent = JSON.stringify(data.chart, null, 2);
});
</script>
</body>
</html>
